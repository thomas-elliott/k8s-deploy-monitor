apiVersion: deploy.deploy-monitor.local/v1alpha1
kind: Monitor
metadata:
  labels:
    app.kubernetes.io/name: k8s-deploy-monitor
    app.kubernetes.io/managed-by: kustomize
  name: monitor-sample
spec:
  namespaceRegex: ^(dev|test|prod)-.*
  namespaceSelector:
    matchLabels:
      deploy-monitor: enabled
  endpoints:
    deployment: https://your-webhook-endpoint-here/deployment
    replicaSet: https://your-webhook-endpoint-here/replicaset
    pod: https://your-webhook-endpoint-here/pod
  auth:
    header: Api-Key
    secretRef:
      name: monitor-sample-api-key
      key: apiKey
