# This rule is not used by the project k8s-deploy-monitor itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to deploy.deploy-monitor.local resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: k8s-deploy-monitor
    app.kubernetes.io/managed-by: kustomize
  name: monitor-viewer-role
rules:
- apiGroups:
  - deploy.deploy-monitor.local
  resources:
  - monitors
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - deploy.deploy-monitor.local
  resources:
  - monitors/status
  verbs:
  - get
